name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate local links and publishable files
        run: python3 scripts/check-site.py
      - name: Prepare public files only
        run: |
          mkdir -p _site/assets/images
          cp index.html styles.css site.js .nojekyll _site/
          cp assets/images/*.webp assets/images/*.png _site/assets/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
